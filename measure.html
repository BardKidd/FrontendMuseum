<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 空 favicon：不寫的話瀏覽器每次載入都去要 /favicon.ico 拿一個 404，
         console 有紅字會讓人以為量測程式壞了 -->
    <link rel="icon" href="data:," />
    <title>量測台 · 前端效能病理標本館</title>
    <!--
      這裡**刻意不手寫** stylesheet 標籤，但這一頁現在確實有樣式：
      `src/shell/Panel.tsx` 走 `import './panel.css'`，那支檔案在 entry chunk 的
      import graph 裡，build 會把它抽成獨立 CSS 資產並自動插進 dist 的這個 <head>。
      手寫一個 <link> 只會多一份要自己維護的路徑。
      （dev server 是 runtime 注入，時序不同 —— 但 dev 的數字本來就作廢。）

      ⚠️ 樣式只掛在面板根容器 `.rep` 底下，零全域選擇器。
      量測面是儀器：動它之前先對照 docs/superpowers/plans/baseline-shell-cost.md 的基線
      （外殼 script 4x median 0.00ms，閘門是漲幅 > 2ms），改完重量一次。

      ⚠️ 零外部請求（spec §4.7）：不准 CDN 字體、不准第三方資源。
      字體一律系統堆疊 —— 量測站點自己去要外部資源等於把污染源寫進實驗器材。

      ⚠️ 2026-07-26：這一頁從 `/` 搬到 `/measure.html`，`/` 現在是首頁／標本索引。
      tools/acceptance.mjs 與 tools/reproducibility.mjs 的 URL_SHELL 必須指到這裡。
    -->
  </head>
  <body>
    <!-- 回首頁。刻意放在 #root 外面：它不進 React 樹、不參與任何重繪，
         所以不會落進待量的那一段。改動之後 npm run acceptance 仍是 13 / 13。

         2026-07-28：從「零樣式」改成有樣式。零樣式的代價是它以瀏覽器預設藍
         底線連結出現在整站唯一沒排版的位置，而它是量測台的第一個像素 ——
         看起來像壞掉，而且高 24px（點擊目標下限 44px）。
         樣式掛在 shell.css 的 `.shell-home`，是靜態規則：套用一次於首次版面，
         之後永不重算，所以「不落進待量的那一段」這個前提沒有被破壞。 -->
    <a class="shell-home" href="/">← 回標本館首頁</a>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
